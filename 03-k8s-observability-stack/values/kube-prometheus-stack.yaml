# kube-prometheus-stack baseline — sized for a 3-AZ EKS cluster, ~50 nodes.
# Tuned so the monitoring stack itself survives node drains and never pages about itself.

alertmanager:
  alertmanagerSpec:
    replicas: 2
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
    retention: 120h

prometheus:
  prometheusSpec:
    replicas: 2
    retention: 15d
    retentionSize: 45GB
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 4Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    # Scrape everything with the standard labels; add namespaces as teams onboard.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

grafana:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: gp3
    size: 10Gi
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://kube-prometheus-stack-prometheus.monitoring:9090
          isDefault: true
        - name: Loki
          type: loki
          url: http://loki.monitoring:3100
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          options:
            path: /var/lib/grafana/dashboards
  sidecar:
    dashboards:
      enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi

defaultRules:
  create: true
  # We replace the stock CPU throttling rules with our own burn-rate rules.
  rules:
    cpuThrottlingHigh: false
