# AnalysisTemplate — the automated rollback gate.
# Prometheus success-rate over the canary pods; failureLimit: 1 aborts the rollout.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: demo-app-success-rate
spec:
  metrics:
    - name: success-rate
      interval: {{ .Values.analysis.interval }}
      count: {{ .Values.analysis.count }}
      successCondition: result[0] >= {{ .Values.analysis.successRateThreshold }}
      failureLimit: {{ .Values.analysis.failureLimit }}
      provider:
        prometheus:
          address: {{ .Values.analysis.prometheusAddress }}
          query: |
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}",service!="",code!~"5.."}[2m]))
            /
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}",service!=""}[2m]))
