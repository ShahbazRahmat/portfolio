# Team workload demo — deploys charts/demo-app as a canary rollout.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/shahbazkareem/eks-gitops-platform
    targetRevision: main
    path: charts/demo-app
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Rollouts advances via analysis, not instant sync:
      - RespectIgnoreDifferences=true
