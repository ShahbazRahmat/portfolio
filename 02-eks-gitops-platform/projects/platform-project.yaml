# AppProject — the guardrail for everything deployed by this repository.
# Sources, destinations and namespaces outside this allow-list fail at sync.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform add-ons and team workloads managed from Git

  sourceRepos:
    - https://github.com/shahbazkareem/eks-gitops-platform
    - https://ingress-nginx.github.io
    - https://charts.jetstack.io
    - https://external-secrets.github.io/external-secrets

  destinations:
    - server: https://kubernetes.default.svc
      namespace: ingress-nginx
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: demo

  # Platform apps must not grab cluster-admin powers.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange

  roles:
    - name: platform-admin
      policies:
        - p, proj:platform:platform-admin, applications, *, platform/*, allow
      groups:
        - argocd-platform-admins
